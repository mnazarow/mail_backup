# Выпуск: метка вида v1.10.0 → тесты (и скрипты установки от root) → черновик GitHub Release →
# автономные архивы, каждый проверен установкой без сети → выпуск публикуется. Если хоть что-то не
# прошло, выпуск остаётся черновиком и его никто не скачает.
#
#   git tag v1.10.0 && git push origin v1.10.0
#
# К выпуску прикладываются обычный архив (scripts/make_release.py — права в нём
# не зависят от машины сборки), точные версии библиотек, с которыми прошли тесты
# (constraints — для MA_CONSTRAINTS), руководство .docx и автономные архивы для
# серверов без интернета — по одному на каждую версию Python (пакеты внутри
# собраны под неё и под x86_64).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Архив и выпуск
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Метка совпадает с VERSION
        run: |
          test "v$(cat VERSION)" = "$GITHUB_REF_NAME" \
            || { echo "Метка $GITHUB_REF_NAME, а в VERSION — $(cat VERSION)"; exit 1; }
      - name: Тесты
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
          pip install "pytest>=8" "httpx>=0.28" "httpx2>=2.16; python_version >= '3.11'"
          python -m pytest -q
      - name: Тесты скриптов установки и обновления от root
        run: sudo env "PATH=$PATH" MA_REQUIRE_SCRIPT_TESTS=1 python -m pytest -q -rs tests/test_install_scripts.py
      - name: Архив выпуска
        run: python scripts/make_release.py dist
      - name: Точные версии библиотек, с которыми прошли тесты
        # для установки ровно этого набора: sudo MA_CONSTRAINTS=файл bash scripts/install.sh (или update.sh);
        # набор собран на Python 3.12 — на другом Python какой-то версии может не быть
        run: |
          out="dist/mailarchiver-$(cat VERSION)-constraints-py3.12.txt"
          { echo "# MailArchiver $(cat VERSION): библиотеки, с которыми прошли тесты выпуска (Python 3.12)"
            pip freeze --exclude-editable; } > "$out"
          grep -qi '^fastapi==' "$out"
      - name: Что нового — из CHANGELOG.md
        run: |
          awk -v head="## [$(cat VERSION)]" '
            index($0, head) == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md > notes.md
          test -s notes.md || echo "См. CHANGELOG.md" > notes.md
          # ссылки на файлы репозитория — полными адресами: на странице выпуска относительные не работают
          sed -i -E "s#\]\((docs/|README\.md|CHANGELOG\.md)#](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/\1#g" notes.md
      - name: Выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(dist/*.tar.gz dist/*-constraints-*.txt)
          for doc in docs/*.docx; do [ -f "$doc" ] && files+=("$doc"); done
          # руководство Word лежит в репозитории (docs/MailArchiver_Руководство.docx); без него — предупреждение
          [ "${#files[@]}" -gt 1 ] || echo "::warning::В docs/ нет руководства .docx — выпуск без него"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft \
            --title "MailArchiver $(cat VERSION)" --notes-file notes.md

  offline:
    name: Автономный архив (Python ${{ matrix.python }})
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Архив с пакетами
        # --only-binary: только готовые пакеты (manylinux) — собранные на этой
        # машине из исходников требовали бы на сервере такой же свежей системы
        run: |
          python -m pip install --upgrade pip
          bash scripts/make_offline_bundle.sh --only-binary dist
          ls -la dist
      - name: Архив ставится без сети
        run: |
          mkdir check && tar -xzf dist/mailarchiver-*-offline-*.tar.gz -C check
          python -m venv check/venv
          check/venv/bin/pip install --no-index --find-links check/mail_backup/wheels \
            -r check/mail_backup/requirements.txt
          check/venv/bin/pip install --no-index --find-links check/mail_backup/wheels --no-deps \
            "mailarchiver==$(cat VERSION)"
          # веб-приложение при импорте читает конфигурацию и создаёт каталог данных —
          # даём ему временный, иначе оно возьмёт /var/lib/mailarchiver
          printf 'paths:\n  data_dir: "%s"\n' "$RUNNER_TEMP/data" > check/config.yaml
          # -I: иначе из корня репозитория импортировались бы исходники, а не установленный пакет
          MAILARCHIVER_CONFIG="$PWD/check/config.yaml" check/venv/bin/python -I -c "import mailarchiver.web.app"
          check/venv/bin/mailarchiver version
      - name: Добавить к выпуску
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/mailarchiver-*-offline-*.tar.gz

  publish:
    name: Опубликовать выпуск
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - name: Черновик → выпуск
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
