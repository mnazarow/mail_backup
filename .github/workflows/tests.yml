# Проверки при каждой отправке в main и в запросах на слияние.
#
#  unit     — весь набор тестов с настоящими библиотеками на всех поддерживаемых
#             версиях Python (локально без FastAPI веб-тесты не запускаются);
#  scripts  — install.sh и update.sh в «песочнице» с поддельным systemd; тестам
#             нужен root, иначе они пропускаются — здесь пропуск считается отказом;
#  install  — настоящие установка и обновление на systemd самой машины сборки:
#             прежняя версия из архива в репозитории → проверка → обновление до
#             текущей → служба отвечает на /health → удаление; задания в отдельном
#             процессе под настоящей защитой systemd;
#  docker   — образ собирается, контейнер отвечает на /health (и с заданиями в
#             отдельном процессе) и останавливается вовремя и без ошибки.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Тесты (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Зависимости (как при установке — из requirements.txt, пакет без зависимостей)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
          # httpx2 — клиент тестов Starlette 1.x (с httpx — предупреждение); на Python 3.10 его нет
          pip install "pytest>=8" "httpx>=0.28" "httpx2>=2.16; python_version >= '3.11'"
          pip check
      - name: Тесты
        run: python -m pytest -q -rs

  postgres:
    # Весь набор тестов на PostgreSQL (1.24.0): у каждого теста своя схема, после теста она удаляется
    name: Тесты на PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --no-deps -e .
          pip install "pytest>=8" "pytest-xdist>=3.5" "httpx>=0.28" "httpx2>=2.16"
          sudo apt-get install -y postgresql-client
      - name: Тесты
        env:
          MA_TEST_PG: postgresql://postgres:ci-password@127.0.0.1:5432/postgres
        run: python -m pytest -q -rs -n 4 --dist loadfile

  scripts:
    name: Скрипты установки и обновления (песочница)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pytest
        run: pip install "pytest>=8"
      - name: Синтаксис скриптов
        run: |
          for f in scripts/*.sh docker/*.sh; do bash -n "$f"; done
          if command -v shellcheck >/dev/null; then shellcheck -S warning -e SC2034 scripts/*.sh docker/*.sh; fi
      - name: Ошибки в коде Python (неопределённые имена, лишние импорты, синтаксис)
        run: |
          pip install "ruff>=0.6"
          ruff check --select F,E9 mailarchiver tests scripts
      - name: Тесты скриптов от root
        # MA_REQUIRE_SCRIPT_TESTS=1: если тесты не могут запуститься (нет root,
        # нет пользователя nobody), это отказ, а не тихий пропуск
        run: sudo env "PATH=$PATH" MA_REQUIRE_SCRIPT_TESTS=1 python -m pytest -q -rs tests/test_install_scripts.py

  install:
    name: Установка и обновление на настоящем systemd (с ${{ matrix.from }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: ["1.2.2", "1.8.0"]
    steps:
      - uses: actions/checkout@v4
      - name: Архив текущей версии
        run: |
          python3 scripts/make_release.py "$RUNNER_TEMP/dist"
          mkdir "$RUNNER_TEMP/new"
          tar -xzf "$RUNNER_TEMP"/dist/mailarchiver-"$(cat VERSION)".tar.gz -C "$RUNNER_TEMP/new"
      - name: Установка прежней версии ${{ matrix.from }}
        run: |
          mkdir "$RUNNER_TEMP/old"
          tar -xzf "mailarchiver-${{ matrix.from }}.tar.gz" -C "$RUNNER_TEMP/old"
          cd "$RUNNER_TEMP/old/mail_backup"
          sudo bash scripts/install.sh </dev/null
          systemctl is-active mailarchiver
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8493/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8493/health
      - name: Проверка перед обновлением (ничего не меняет)
        run: |
          cd "$RUNNER_TEMP/new/mail_backup"
          sudo bash scripts/update.sh --check
          systemctl is-active mailarchiver
      - name: Обновление до текущей версии
        run: |
          cd "$RUNNER_TEMP/new/mail_backup"
          sudo bash scripts/update.sh
      - name: Служба работает на новой версии
        run: |
          systemctl is-active mailarchiver
          curl -fsS http://127.0.0.1:8493/health
          installed="$(sudo /opt/mailarchiver/venv/bin/python -I -c 'from mailarchiver.version import __version__; print(__version__)')"
          echo "установлена версия: $installed"
          test "$installed" = "$(cat VERSION)"
          sudo mailarchiver check-config
      - name: Диск с данными «отключён» — обновление отказывается и ничего не трогает
        run: |
          sudo systemctl stop mailarchiver
          sudo mv /var/lib/mailarchiver /var/lib/mailarchiver.real
          sudo ln -s /mnt/no-such-disk/mailarchiver /var/lib/mailarchiver
          # как на сервере, где это случилось: служба перезапускается и падает со status=226/NAMESPACE
          sudo systemctl start mailarchiver || true
          sleep 3
          state() { sudo find /opt/mailarchiver /etc/mailarchiver /etc/systemd/system/mailarchiver.service* \
                      /usr/local/bin/mailarchiver -printf '%p %m %u %s %T@\n' 2>/dev/null | sort | sha256sum; }
          before="$(state)"
          cd "$RUNNER_TEMP/new/mail_backup"
          if sudo bash scripts/update.sh --check; then echo "проверка должна была отказать"; exit 1; fi
          if sudo bash scripts/update.sh; then echo "обновление должно было отказать"; exit 1; fi
          test "$before" = "$(state)" || { echo "обновление что-то изменило на диске"; exit 1; }
          test ! -e /mnt/no-such-disk                  # каталог на месте неподключённого диска не создан
          sudo rm /var/lib/mailarchiver
          sudo mv /var/lib/mailarchiver.real /var/lib/mailarchiver
          sudo systemctl reset-failed mailarchiver || true
          sudo systemctl restart mailarchiver
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8493/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8493/health
      - name: Повторное обновление той же версией
        run: |
          cd "$RUNNER_TEMP/new/mail_backup"
          sudo bash scripts/update.sh
          curl -fsS http://127.0.0.1:8493/health
      - name: Удаление и чистая установка текущей версии
        run: |
          cd "$RUNNER_TEMP/new/mail_backup"
          sudo bash scripts/uninstall.sh --purge </dev/null
          test ! -e /opt/mailarchiver
          sudo bash scripts/install.sh </dev/null
          systemctl is-active mailarchiver
          curl -fsS http://127.0.0.1:8493/health
      - name: Задания в отдельном процессе (под защитой systemd)
        run: |
          sudo grep -q '^  worker_process: false' /etc/mailarchiver/config.yaml
          sudo sed -i 's/^  worker_process: false/  worker_process: true/' /etc/mailarchiver/config.yaml
          sudo mailarchiver check-config
          sudo systemctl restart mailarchiver
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8493/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8493/health
          main="$(systemctl show mailarchiver -p MainPID --value)"
          pgrep -P "$main" -f spawn_main          # дочерний процесс заданий запущен
          sudo journalctl -u mailarchiver --since "-2min" --no-pager | grep "в отдельном процессе"
          sudo systemctl stop mailarchiver
          test "$(systemctl show mailarchiver -p Result --value)" = success   # без принудительного завершения
          if pgrep -f spawn_main; then echo "процесс заданий пережил остановку службы"; exit 1; fi
          sudo sed -i 's/^  worker_process: true/  worker_process: false/' /etc/mailarchiver/config.yaml
          sudo systemctl start mailarchiver
      - name: Журнал службы (при отказе)
        if: failure()
        run: |
          systemctl status mailarchiver --no-pager -l || true
          sudo journalctl -u mailarchiver -n 200 --no-pager || true
          ls -la /opt/mailarchiver /var/lib/mailarchiver /etc/mailarchiver || true

  docker:
    name: Образ Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -f docker/Dockerfile -t mailarchiver:ci .
      - name: Контейнер отвечает, задания — в том же и в отдельном процессе
        run: |
          set -e
          for mode in 0 1; do
            docker run -d --name "ma$mode" -e MAILARCHIVER_WORKER_PROCESS="$mode" -p "127.0.0.1:$((8500+mode)):8493" mailarchiver:ci
            for i in $(seq 1 60); do curl -fsS "http://127.0.0.1:$((8500+mode))/health" && break; sleep 1; done
            curl -fsS "http://127.0.0.1:$((8500+mode))/health"
            test "$(docker exec "ma$mode" mailarchiver version | grep -o '[0-9][0-9.]*' | head -1)" = "$(cat VERSION)"
            spawned="$(docker top "ma$mode" | grep -c spawn_main || true)"
            if [ "$mode" = 1 ]; then test "$spawned" -ge 1; else test "$spawned" = 0; fi
            # остановка: идущие задания возвращаются в очередь, контейнер выходит сам и с кодом 0
            docker stop -t 30 "ma$mode"
            test "$(docker inspect -f '{{.State.ExitCode}}' "ma$mode")" = 0
            docker logs "ma$mode" 2>&1 | grep -q "Сервис остановлен"
          done
      - name: Журналы контейнеров (при отказе)
        if: failure()
        run: |
          docker logs ma0 || true
          docker logs ma1 || true
