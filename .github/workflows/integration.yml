# Интеграционные тесты с настоящими серверами (1.22.0): Dovecot, Postfix, OpenLDAP, Radicale — без Docker,
# пакетами Ubuntu; с 1.23.0 — и Keycloak (единый вход OpenID Connect и SAML). Стенд — scripts/integration/stand.sh,
# тесты — tests/integration.
name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-servers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Почтовые серверы и каталог
        run: |
          echo "postfix postfix/main_mailer_type select Local only" | sudo debconf-set-selections
          echo "postfix postfix/mailname string mx.corp.test" | sudo debconf-set-selections
          echo "slapd slapd/no_configuration boolean true" | sudo debconf-set-selections
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq dovecot-imapd dovecot-lmtpd \
            dovecot-managesieved dovecot-sieve postfix slapd ldap-utils
          sudo systemctl stop postfix dovecot slapd || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Keycloak
        env:
          KC_VERSION: "26.4.2"
        run: |
          base="https://github.com/keycloak/keycloak/releases/download/$KC_VERSION"
          curl -fsSL -o keycloak.tar.gz "$base/keycloak-$KC_VERSION.tar.gz"
          echo "$(curl -fsSL "$base/keycloak-$KC_VERSION.tar.gz.sha1")  keycloak.tar.gz" | sha1sum -c -
          sudo mkdir -p /opt && sudo tar -xzf keycloak.tar.gz -C /opt
          echo "KC_HOME=/opt/keycloak-$KC_VERSION" >> "$GITHUB_ENV"
      - name: Зависимости
        run: python -m pip install -e ".[test]" radicale
      - name: Стенд
        run: sudo MA_STAND_PYTHON="$(which python)" MA_STAND_KEYCLOAK="$KC_HOME" JAVA_HOME="$JAVA_HOME" PATH="$JAVA_HOME/bin:$PATH" scripts/integration/stand.sh start
      - name: Тесты
        run: MA_IT=1 python -m pytest tests/integration -v -p no:cacheprovider
      - name: Журналы стенда
        if: failure()
        run: sudo tail -n 80 /tmp/ma-stand/*.log || true
