<!doctype html>
<html lang="ru" data-theme="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  <script>
    // Ранняя установка темы (без мигания)
    (function(){ try {
      var t = localStorage.getItem('ma-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme','dark');
    } catch(e){} })();
    window.MA_VERSION = "{{ version }}";
  </script>
</head>
<body>
  <div id="root"><div class="auth-wrap"><div class="spinner"></div></div></div>
  <div class="toasts" id="toasts"></div>
  <script src="/static/js/app.js?v={{ version }}"></script>
</body>
</html>
