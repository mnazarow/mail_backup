# ============================================================================
#  MailArchiver — файл конфигурации
#  Скопируйте в /etc/mailarchiver/config.yaml (или config/config.yaml)
#  и отредактируйте под себя. Все параметры имеют разумные значения по
#  умолчанию — можно менять только нужное (лишние строки можно удалить).
#  Подробности по каждому параметру: docs/ru/05-parameters-reference.md
#
#  Проверка файла:  sudo -u mailarchiver /opt/mailarchiver/venv/bin/mailarchiver check-config
#  Опечатка в имени параметра выводится предупреждением, неверное значение — ошибкой.
#  Большинство параметров можно менять и в веб-интерфейсе («Настройки»);
#  значение из интерфейса важнее значения из этого файла.
# ============================================================================

server:                  # задаётся ТОЛЬКО здесь; после изменения — перезапуск службы
  host: "127.0.0.1"      # 0.0.0.0 — слушать на всех интерфейсах (за reverse proxy)
  port: 8493
  public_url: ""         # внешний адрес интерфейса, напр. "https://mail-backup.example.ru"
  behind_proxy: false    # true, если стоите за nginx/traefik с TLS
  # Кому верить в заголовке X-Forwarded-For. Настоящим адресом клиента считается
  # первый СПРАВА хоп, которого нет в этом списке (левую часть цепочки дописывает
  # сам клиент). Без списка защита от подбора пароля обходится подстановкой
  # заголовка. Отдельные адреса и сети через запятую; «*» отключает проверку.
  trusted_proxies: "127.0.0.1, ::1"
  # Очередь заданий и расписания — в отдельном процессе той же службы: копирование не делит
  # интерпретатор с веб-интерфейсом, и интерфейс не тормозит во время копий (ещё ~60–100 МБ памяти).
  worker_process: false

security:
  auth_enabled: true
  session_ttl_hours: 12
  session_idle_minutes: 60
  min_password_length: 8
  max_login_attempts: 5  # от этого числа считаются и остальные пределы (см. справочник)
  lockout_minutes: 15
  secure_cookie: false   # true при работе только по HTTPS
  require_2fa: false     # true — администраторы обязаны включить вход с кодом из приложения
  mailbox_login: true    # вход сотрудников по email и паролю своего ящика
  imap_ssl_verify: true  # проверять TLS-сертификат IMAP-сервера

paths:
  data_dir: ""           # пусто = /var/lib/mailarchiver (или ./data при запуске из исходников)

storage:
  compress: false        # true — сжимать письма gzip (экономия места)
  fsync: true
  min_free_space_mb: 500
  verify_after_write: true
  # Шифрование локальной копии (AES-256-GCM). Файл ключа храните ОТДЕЛЬНО от
  # каталога данных и обязательно сделайте его копию: без ключа письма не прочитать.
  # Создать ключ:  mailarchiver storage-key --generate /etc/mailarchiver/storage.key
  encrypt: false
  encryption_key_file: ""   # абсолютный путь, напр. "/etc/mailarchiver/storage.key"

backup:
  max_concurrent_jobs: 2     # 1–16; с одним ящиком одновременно работает одно задание
  fetch_batch_size: 200
  connect_timeout_s: 30
  socket_timeout_s: 120
  retry_attempts: 4          # всего попыток: первый запуск и до трёх повторов
  download_flags: true
  skip_larger_than_mb: 0
  unreadable_folder_grace_runs: 3
  folder_include: []     # напр. ["INBOX", "Отправленные"] — пусто = все папки
  folder_exclude: []     # напр. ["[Gmail]/Корзина", "Спам"]

retention:
  enabled: false         # общая очистка по сроку keep_days (свой срок ящика действует всегда)
  keep_days: 0           # 0 = хранить вечно
  cron: "30 4 * * *"     # когда запускать ежедневную очистку
  keep_last_runs: 30

export:
  default_engine: "auto"   # auto|aspose|native|mbox|eml
  pst_format: "unicode"    # unicode (Outlook 2003+) | ansi (Outlook 97–2002)
  pst_split_size_mb: 0
  keep_days: 30            # удалять готовые выгрузки старше N дней (0 — не удалять)
  aspose_license_path: ""
  tmp_dir: ""              # каталог временных файлов (пусто = <data_dir>/tmp)

scheduler:
  enabled: true
  timezone: "Europe/Moscow"
  misfire_grace_time_s: 3600
  coalesce: true

logging:
  level: "INFO"          # DEBUG | INFO | WARNING | ERROR
  to_stdout: true        # задаётся только здесь

notifications:
  enabled: false
  smtp_host: ""
  smtp_port: 587
  smtp_security: "starttls"
  smtp_user: ""
  smtp_password: ""      # лучше задать в интерфейсе: там он хранится зашифрованным
  mail_from: ""
  mail_to: []
  on_failure: true
  on_success: false
  summary_enabled: true  # еженедельная сводка администраторам (если уведомления включены)
  summary_cron: "0 8 * * 1"
  telegram_bot_token: ""   # Telegram: токен бота (лучше задать в интерфейсе — там хранится зашифрованным)
  telegram_chat_id: ""     # Telegram: чат, группа или канал
  telegram_api_url: "https://api.telegram.org"
  webhook_url: ""          # вебхук: POST с JSON на этот адрес
  webhook_format: "json"   # json | slack (Slack, Mattermost, Rocket.Chat)
  webhook_secret: ""       # подпись HMAC-SHA256 в заголовке X-MailArchiver-Signature

employees:
  sync_enabled: false        # синхронизировать справочник сотрудников по расписанию
  source_type: "file"        # file (файл на сервере) | url (адрес выгрузки) | ldap (каталог AD)
  source_file: ""            # путь к CSV/XLSX/XML на сервере
  source_url: ""             # https://… (при source_type: url)
  source_url_user: ""
  source_url_password: ""    # лучше задать в интерфейсе: там он хранится зашифрованным
  source_url_verify_ssl: true
  source_url_timeout_s: 60   # за это время выгрузка должна скачаться целиком
  source_url_format: "auto"  # auto | csv | xlsx
  cron: "0 5 * * *"
  create_accounts: true      # заводить ящики новым сотрудникам (нужен account_host)
  account_host: ""           # IMAP-сервер создаваемых ящиков, напр. "mx.example.ru"
  account_port: 993
  account_security: "ssl"    # ssl | starttls | plain
  account_name_template: "{full_name}"
  account_username_template: "{email}"
  account_notes_template: "Создан автоматически для сотрудника."
  account_enabled: false
  account_folder_include: []
  account_folder_exclude: []
  account_retention_days: -1 # -1 = как в общих настройках, 0 = вечно, N = дней
  account_schedule_enabled: false
  account_schedule_cron: "0 2 * * *"
  account_use_master: false  # новые ящики — вход через администратора почты (см. mailadmin)
  account_use_axigen_ftp: false  # новые ящики — копирование через FTP Backup Axigen (см. axigen)
  dismiss_from_file: true    # отмечать уволенных по колонкам «Работает»/«Уволен»/«Дата увольнения»
  dismiss_missing_days: 0    # уволен, если нет в выгрузке N дней (0 — не считать)
  dismissed_action: "final_backup_disable"   # final_backup_disable | keep
  dismissed_keep_years: 5    # сколько лет удерживать архив уволенного (0 — бессрочно)

replica:                     # копия архива вне сервера (docs/ru/13-replica.md)
  enabled: false
  target: "dir"              # dir (сетевая папка/диск) | rsync (сервер по SSH) | s3
  cron: "0 6 * * *"          # в это же время — ежедневный снимок базы
  include_db: true           # класть в копию снимки базы
  db_snapshot_keep: 3        # сколько снимков базы хранить (0 — не делать)
  mirror_deletions: true     # удалять в копии удалённое из архива
  max_delete_percent: 50     # защита от массового удаления
  parallel: 4
  verify_every_days: 7       # полная сверка копии с архивом
  timeout_s: 120
  dir_path: ""               # /mnt/backup/mailarchiver
  rsync_dest: ""             # backup@backup.example.ru:/srv/mailarchiver
  ssh_port: 22
  ssh_key_file: ""           # пусто — ключ службы <каталог данных>/replica_ssh_key
  bwlimit_kbps: 0
  s3_endpoint: ""            # https://storage.yandexcloud.net
  s3_region: "ru-central1"
  s3_bucket: ""
  s3_prefix: "mailarchiver/"
  s3_access_key: ""
  s3_secret_key: ""          # лучше задать в интерфейсе: там он хранится зашифрованным
  s3_path_style: true
  s3_storage_class: ""       # пусто — стандартный; для «холодной» копии, напр. COLD
  s3_verify_ssl: true

monitoring:                  # метрики /metrics для Prometheus и Zabbix (docs/ru/14-monitoring.md)
  metrics_enabled: false
  metrics_token: ""          # Bearer-токен, не короче 16 символов; лучше задать в интерфейсе
  metrics_allowed_ips: ["127.0.0.1", "::1"]   # откуда можно без токена
  per_account_metrics: true

search:                      # поиск по письмам (docs/ru/15-search.md)
  enabled: true
  index_bodies: true         # искать и по тексту писем
  index_bodies_encrypted: false   # индексировать текст при шифровании копии (не рекомендуется)
  body_max_kb: 16
  index_attachments: true    # искать и по тексту вложений (PDF, Word, Excel, PowerPoint, OpenDocument, RTF)
  attachment_max_kb: 10240   # вложения крупнее не разбираются
  attachment_text_kb: 64     # текста вложений одного письма в индексе, КБ
  attachment_time_s: 10      # предел времени на разбор одного вложения, секунд
  ocr: false                 # распознавать сканы и картинки (нужны tesseract-ocr, tesseract-ocr-rus, poppler-utils)
  ocr_lang: "rus+eng"
  ocr_max_pages: 5           # страниц скана в PDF, не больше
  ocr_time_s: 60             # предел времени на распознавание одного вложения, секунд

replies:                     # раздел «Ответы на письма» (docs/ru/06-analytics.md)
  enabled: true              # вести индекс ответов (фоновое задание читает заголовки новых писем)
  sla_hours: 24              # срок ответа на входящее письмо, часов
  sla_business: false        # срок считать в рабочих часах
  work_days: "1-5"           # рабочие дни: 1 — понедельник … 7 — воскресенье
  work_hours: "09:00-18:00"  # рабочее время (часовой пояс планировщика)
  internal_domains: []       # свои домены сверх доменов ящиков архива, напр. ["spb.company.ru"]
  exclude_senders: []        # не ждать ответа от: адрес, @домен, домен или маска *, напр. ["jira@company.ru"]
  match_subject: true        # ответ без In-Reply-To связывать по теме и собеседнику (14 дней)

webmail:                     # почтовый клиент раздела «Почта» (docs/ru/22-mailclient.md)
  enabled: true              # писать письма и менять ящик на сервере из «Почты»
  admin_actions: false       # администратор может писать и менять ящики сотрудников (с записью в аудит)
  mark_read: true            # открытое сотрудником письмо отмечать прочитанным
  auto_refresh_s: 120        # проверять новую почту открытой папки, секунд (0 — не проверять)
  max_attachments_mb: 25     # вложения одного письма, МБ (1–30)
  save_sent: "auto"          # копия отправленного в «Отправленные»: auto | always | never
  drafts_keep_days: 30       # черновик, которого не касались столько дней, удаляется
  undo_send_s: 5             # «Отменить отправку»: письмо ждёт столько секунд (0 — уходит сразу)
  rules_interval_min: 5      # правила и автоответ без открытого клиента: проверять «Входящие», минут (0 — нет)
  push: true                 # новая почта сразу (IMAP IDLE), пока клиент открыт
  drafts_on_server: true     # черновики клиента — и в папку «Черновики» сервера (видны на телефоне)
  phishing_report_to: ""     # «Сообщить о фишинге»: адрес службы безопасности ('' — только в «Спам»)
  dlp_mode: "warn"           # конфиденциальные данные в письме: off | warn | block_external
  warn_external: true        # предупреждать, что письмо уходит за пределы организации
  warn_recipients: 20        # предупреждать о большом списке адресатов в «Кому» и «Копии» (0 — нет)
  smime_ca_file: ""          # доверенные центры организации для подписей S/MIME (PEM), кроме системных
  send_limit_hour: 300       # адресатов в час с одного ящика (0 — без предела)
  # уведомления о новой почте на компьютер и телефон сотрудника (Web Push, 1.22.0); нужен https
  web_push: false            # разрешить сотрудникам включать уведомления на своих устройствах
  web_push_preview: true     # отправитель и тема в уведомлении (иначе — «Новое письмо»)
  web_push_poll_min: 5       # ящик без IMAP IDLE: проверять «Входящие» раз в столько минут
  web_push_hosts: [fcm.googleapis.com, push.services.mozilla.com, push.apple.com, notify.windows.com]
  web_push_contact: ""       # mailto:адрес администратора для служб доставки ('' — адрес сервера)

journal:                     # приём журналирования по SMTP (docs/ru/23-compliance.md)
  enabled: false
  listen: "127.0.0.1"        # 0.0.0.0 — принимать на всех адресах
  port: 2525
  allowed_ips: ["127.0.0.1", "::1"]   # почтовые серверы, которым можно отправлять журнал
  address: ""                # адрес журнала в конверте (сам он ящиком не считается)
  folder: "Журнал"
  unwrap_exchange: true      # разворачивать журнальные отчёты Exchange
  tls_cert: ""               # сертификат и ключ для STARTTLS (PEM)
  tls_key: ""
  require_tls: false
  auth_user: ""              # SMTP AUTH почтового сервера ('' — без входа); вход — только после STARTTLS
  auth_password: ""          # лучше задать в интерфейсе — там хранится зашифрованным
  client_ca: ""              # центр сертификатов почтовых серверов (PEM): без сертификата — отказ
  max_size_mb: 50

audit:                       # аудит (docs/ru/23-compliance.md)
  keep_days: 365             # хранить записи, дней (0 — всегда)
  message_views: true        # записывать, кто из персонала открывал письма ящиков
  syslog_host: ""            # копия аудита на сервер журналов / SIEM ('' — не пересылать)
  syslog_port: 514
  syslog_proto: "udp"        # udp | tcp | tls
  syslog_tls_verify: true
  syslog_hostname: ""

cases:                       # дела (docs/ru/23-compliance.md)
  export_keep_days: 0        # хранить выгрузки дел, дней (0 — пока не удалено дело)
  sign_exports: true         # подписывать опись выгрузки ключом Ed25519 сервера

drill:                       # проверка восстановления (docs/ru/23-compliance.md)
  enabled: true
  cron: "15 5 1 * *"         # 1-го числа в 05:15
  sample: 50                 # писем на ящик

ldap:                        # вход через LDAP / Active Directory (docs/ru/08-security.md)
  enabled: false
  url: ""                    # ldaps://dc01.company.local или ldap://… со StartTLS
  starttls: true
  verify_ssl: true
  bind_dn: ""                # служебная учётная запись для поиска пользователей
  bind_password: ""          # лучше задать в интерфейсе — там хранится зашифрованным
  base_dn: ""                # DC=company,DC=local
  user_filter: "(&(objectClass=user)(sAMAccountName={login}))"
  admin_group: ""            # DN группы администраторов архива
  operator_group: ""         # DN группы операторов
  nested_groups: true
  employee_login: false      # сотрудники входят доменным паролем в архив своих ящиков
  sync_users: true           # раз в час сверять пользователей из каталога: исключённых — отключать
  employee_base_dn: ""       # источник справочника сотрудников (employees.source_type: ldap): где искать
  employee_filter: "(&(objectCategory=person)(objectClass=user)(mail=*))"
  timeout_s: 10

oidc:                        # единый вход OpenID Connect (docs/ru/08-security.md), 1.22.0
  enabled: false
  issuer: ""                 # https://sso.company.ru/realms/company, https://login.microsoftonline.com/<tenant>/v2.0
  client_id: ""
  client_secret: ""          # лучше задать в интерфейсе: там хранится зашифрованным ('' — публичный клиент с PKCE)
  scopes: "openid email profile"
  username_claim: "preferred_username"
  role_claim: "groups"       # для ролей Keycloak — realm_access.roles
  admin_values: []           # группы/роли администраторов архива
  operator_values: []        # группы/роли операторов
  employee_login: false      # остальные — сотрудники: архив своих ящиков по адресу email
  use_userinfo: false        # дополнять данными userinfo (если групп нет в id_token)
  button_text: "Войти через единый вход"
  redirect_uri: ""           # '' — <адрес интерфейса>/api/auth/oidc/callback
  verify_ssl: true

mailadmin:                   # вход в ящики через администратора почты (docs/ru/16-mailadmin.md)
  enabled: false
  host: ""                   # IMAP-сервер, для которого действует вход администратора
  user: ""
  password: ""               # лучше задать в интерфейсе: там он хранится зашифрованным
  mode: "sasl_plain"         # sasl_plain | separator
  separator: "*"

axigen:                      # сервер Axigen: CLI и FTP Backup (docs/ru/19-axigen.md)
  enabled: false
  host: ""                   # имя или IP сервера Axigen, напр. "10.0.0.5"
  admin_user: "admin"        # администратор Axigen (лучше отдельный, только для архива)
  admin_password: ""         # лучше задать в интерфейсе: там он хранится зашифрованным
  cli_port: 7000
  cli_tls: "none"            # none | tls — к другой машине только tls (SSL-слушатель CLI)
  ftp_port: 21
  ftp_tls: "none"            # none | explicit (AUTH TLS) | implicit (SSL-слушатель FTP Backup)
  tls_verify: true
  cli_cert_sha256: ""        # отпечаток самоподписанного сертификата — задаётся кнопкой «Доверять»
  ftp_cert_sha256: ""
  allow_plaintext: false     # разрешить пароль администратора по сети без шифрования (не рекомендуется)
  ftp_user: ""               # пусто — администратор CLI
  ftp_password: ""
  imap_host: ""              # как поле «Сервер» у ящиков этого сервера, напр. "mx.example.ru"
  domains: []                # пусто — все домены сервера
  allow_changes: false       # разрешить изменения на сервере (только по кнопке, с проверкой)
  ftp_account_path: ""       # пусто — каталог ящика ищется сам; иначе напр. "domains/{domain}/{local}"
  ftp_name_encoding: "auto"  # auto | utf7 | utf8 — кодировка имён папок в FTP Backup
  ftp_exclude_folders: ["Calendar", "Contacts", "Tasks", "Notes", "Journal", "Календарь", "Контакты", "Задачи", "Заметки", "Дневник"]   # не почта
  timeout_s: 60
  sync_enabled: false        # сверять учётные записи по расписанию
  sync_cron: "40 4 * * *"
  sync_add_new: false        # заводить ящики в архиве для новых учётных записей
  new_mailbox_auth: "axigen_ftp"   # axigen_ftp | password — как копировать заведённые ящики
  monitor_enabled: true      # следить за состоянием сервера (каждые 15 минут)
  alert_queue: 500           # предупреждать об очереди от N писем
  alert_license_days: 30     # предупреждать о лицензии за N дней
  alert_quota_percent: 90    # предупреждать о заполнении ящика от N %
